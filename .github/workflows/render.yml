name: Render Football Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-sil-padauk

      - name: Render Video
        run: |
          npx remotion render src/index.tsx MatchPreview out/output.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-video
          path: out/output.mp4
