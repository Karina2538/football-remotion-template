name: Render Football Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # မြန်မာစာ ဖောင့်များ စနစ်တကျ ထည့်သွင်းခြင်း
      - name: Install Myanmar Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-ui-core fonts-sil-padauk

      # Chrome / Puppeteer အတွက် လိုအပ်သော Linux Libraries များ
      - name: Install Remotion Dependencies
        run: npx remotion browser ensure

      - name: Render Video
        run: |
          npx remotion render src/index.ts MatchPreview out/output.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-video
          path: out/output.mp4
